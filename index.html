<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃玉翔會不會來？ - 8-Bit 復古街機轉盤 (307課表與隨機事件版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d081d;
            --card-bg: #1a1235;
            --accent-green: #00ff88;
            --accent-red: #ff2a6d;
            --accent-gold: #ffcc00;
            --accent-cyan: #05d9e8;
            --accent-purple: #b537f2;
            --text-color: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 8px;
            background-image: 
                radial-gradient(#1f1545 15%, transparent 16%),
                radial-gradient(#1f1545 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            overflow-x: hidden;
        }

        /* CRT Scanline Effect */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
            font-size: 1.5rem;
            color: var(--accent-gold);
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #ff2a6d;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: bold;
        }

        .main-layout {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 900px) {
            .main-layout {
                grid-template-columns: 310px 1fr 260px;
            }
        }

        /* Pixel Box Styling */
        .pixel-box {
            background: var(--card-bg);
            border: 4px solid #fff;
            box-shadow: 
                0 0 0 4px #000, 
                5px 5px 0px 4px #000;
            padding: 14px;
            position: relative;
            margin-bottom: 12px;
        }

        .pixel-title {
            font-family: 'Press Start 2P', 'Noto Sans TC', monospace;
            font-size: 0.8rem;
            color: var(--accent-gold);
            background: #000;
            display: inline-block;
            padding: 4px 8px;
            margin-bottom: 10px;
            border: 2px solid var(--accent-gold);
        }

        /* Left Panel - Profile & Schedule */
        .profile-card { text-align: center; }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 10px;
            border: 4px solid var(--accent-gold);
            box-shadow: 0 0 0 4px #000;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        .badge-school {
            background: #e63946;
            color: #fff;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
            display: inline-block;
            margin-bottom: 4px;
        }

        /* Schedule selector */
        .day-buttons {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            justify-content: center;
        }

        .btn-day {
            font-size: 0.7rem;
            padding: 4px 8px;
            background: #1f1838;
            color: #aaa;
            border: 2px solid #555;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-day.active {
            background: var(--accent-gold);
            color: #000;
            border-color: #000;
        }

        .schedule-info {
            font-size: 0.75rem;
            background: #000;
            border: 2px solid #333;
            padding: 8px;
            margin-top: 8px;
            text-align: left;
            line-height: 1.5;
        }

        .subject-tag {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 2px;
            font-size: 0.7rem;
            margin: 1px;
        }

        .tag-main { background: #b5179e; color: #fff; } /* Core subject */
        .tag-easy { background: #2a9d8f; color: #fff; } /* Non-core */

        /* Center Panel - Wheel */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }

        #wheelCanvas {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 
                0 0 0 6px #000,
                0 0 0 10px var(--accent-gold),
                0 0 20px rgba(0,255,200,0.3);
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid var(--accent-gold);
            filter: drop-shadow(0px 3px 0px #000);
            z-index: 10;
        }

        .center-avatar-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid var(--accent-gold);
            box-shadow: 0 0 0 3px #000;
            overflow: hidden;
            background: #000;
            z-index: 5;
            pointer-events: none;
        }

        .center-avatar-hub img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .btn-pixel {
            font-family: 'Press Start 2P', 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            padding: 8px 12px;
            background: #2a2a40;
            color: #fff;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-gold { background: var(--accent-gold); color: #000; border-color: #000; font-weight: bold; }
        .btn-green { background: var(--accent-green); color: #000; border-color: #000; font-weight: bold; }
        .btn-cyan { background: var(--accent-cyan); color: #000; border-color: #000; font-weight: bold; }

        .result-box {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
            background: #090514;
            border: 3px solid var(--accent-cyan);
            box-shadow: 4px 4px 0px #000;
            padding: 10px;
            text-align: center;
        }

        /* Right Panel - Random Events & Telephone */
        .phone-box {
            background: #2d0b2e;
            border: 3px solid var(--accent-purple);
            box-shadow: 3px 3px 0px #000;
            padding: 12px;
            text-align: center;
            margin-bottom: 12px;
            position: relative;
        }

        .phone-btn {
            background: linear-gradient(135deg, #ff007f, #b537f2);
            color: #fff;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }

        .phone-btn:hover {
            filter: brightness(1.2);
        }

        .phone-status {
            font-size: 0.75rem;
            margin-top: 6px;
            color: var(--accent-cyan);
            min-height: 20px;
        }

        .event-toggle-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.75rem;
        }

        .event-card {
            background: #000;
            border: 2px solid #444;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .event-card.active {
            border-color: var(--accent-red);
            background: #20050c;
        }

        .event-card input {
            cursor: pointer;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: -42px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .speech-bubble.show { opacity: 1; }

        /* Log Box */
        .log-box {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.75rem;
            background: #000;
            border: 2px solid #333;
            padding: 6px;
            font-family: monospace;
            text-align: left;
        }

        .tag-yes { color: var(--accent-green); font-weight: bold; }
        .tag-no { color: var(--accent-red); font-weight: bold; }
        .prob-badge {
            background: #222;
            color: var(--accent-gold);
            padding: 2px 6px;
            border: 1px solid var(--accent-gold);
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 4px;
        }

        #confettiCanvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 998;
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <canvas id="confettiCanvas"></canvas>

    <div class="header">
        <h1>黃玉翔會不會來？</h1>
        <p>🎮 8-BIT 復古街機轉盤 (307課表與動態事件版) 🎮</p>
    </div>

    <div class="main-layout">
        
        <!-- Left Panel: Profile & Schedule -->
        <div class="left-panel">
            <div class="pixel-box profile-card">
                <div class="pixel-title">CHARACTER</div>
                
                <div class="avatar-container" onclick="speakRandomQuote()">
                    <div class="speech-bubble" id="speechBubble">Timing對了就來！</div>
                    <img src="19169_2.jpg" class="avatar-img" alt="黃玉翔" onerror="this.src='https://via.placeholder.com/140/000/fff?text=黃玉翔'">
                </div>

                <div>
                    <span class="badge-school">市立武陵高中 307班</span><br>
                    <strong>黃玉翔</strong> <span style="color:var(--accent-gold);">LV.99</span>
                </div>

                <!-- Timetable Day Selector -->
                <div style="margin-top:10px;">
                    <span style="font-size:0.75rem; font-weight:bold; color:var(--accent-gold);">🗓️ 選擇星期課表：</span>
                    <div class="day-buttons">
                        <button class="btn-day" id="day-Mon" onclick="selectDay('Mon')">一</button>
                        <button class="btn-day" id="day-Tue" onclick="selectDay('Tue')">二</button>
                        <button class="btn-day" id="day-Wed" onclick="selectDay('Wed')">三</button>
                        <button class="btn-day" id="day-Thu" onclick="selectDay('Thu')">四</button>
                        <button class="btn-day" id="day-Fri" onclick="selectDay('Fri')">五</button>
                    </div>
                </div>

                <div class="schedule-info" id="scheduleInfo">
                    <!-- Dynamic schedule info loaded via JS -->
                </div>
            </div>
        </div>

        <!-- Center Panel: Main Wheel -->
        <div class="center-panel">
            <div class="pixel-box wheel-section">
                <div class="pixel-title" id="currentModeTitle">MODE: 🌅 上午模式</div>
                
                <div class="prob-badge" id="probDisplay">即時算出機率：--%</div>

                <div class="wheel-wrapper">
                    <div class="pointer"></div>
                    <canvas id="wheelCanvas" width="300" height="300"></canvas>
                    <div class="center-avatar-hub">
                        <img src="19169_2.jpg" alt="黃玉翔" onerror="this.src='https://via.placeholder.com/65/000/fff?text=黃'">
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-pixel btn-green" onclick="switchAndSpin('AM')">
                        🌅 抽上午
                    </button>
                    <button class="btn-pixel btn-cyan" onclick="switchAndSpin('PM')">
                        🌆 抽下午
                    </button>
                    <button class="btn-pixel btn-gold" onclick="spinFullDay()">
                        ⚡ 全日雙考驗
                    </button>
                </div>

                <div class="result-box" id="resultBox">
                    <div style="color:var(--accent-gold); font-weight:bold; font-size:1rem;">READY TO SPIN!</div>
                    <div style="font-size:0.8rem; color:#ccc; margin-top:4px;">結合 307 課表 + 遊戲更新 + 催來電</div>
                </div>
            </div>

            <div class="pixel-box">
                <div class="pixel-title">LOGS</div>
                <div class="log-box" id="logBox">
                    <div>[系統就緒] 載入武陵 307 班課表數據完成。</div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Phone & Dynamic Events -->
        <div class="right-panel">
            
            <!-- Phone Call Widget -->
            <div class="phone-box">
                <div style="font-size:0.8rem; font-weight:bold; color:var(--accent-purple);">☎️ 熱線急催</div>
                <div style="font-size:0.75rem; color:#ddd; margin:4px 0;">「Timing很重要，快點來啦！」</div>
                <button class="phone-btn" onclick="callHotline()">
                    📞 撥打電話催人 (+15%)
                </button>
                <div class="phone-status" id="phoneStatus">通話狀態: 待命</div>
            </div>

            <!-- Dynamic Events -->
            <div class="pixel-box">
                <div class="pixel-title">EVENT MODS</div>
                <div class="event-toggle-group">
                    
                    <div class="event-card" id="cardBA" onclick="toggleEvent('BA')">
                        <div>
                            <strong>😭 蔚藍檔案更新</strong><br>
                            <span style="color:var(--accent-red); font-size:0.65rem;">出席率大降 (-25%)</span>
                        </div>
                        <input type="checkbox" id="chkBA" pointer-events="none">
                    </div>

                    <div class="event-card" id="cardBS" onclick="toggleEvent('BS')">
                        <div>
                            <strong>🌵 荒野亂鬥更新</strong><br>
                            <span style="color:#ff9f1c; font-size:0.65rem;">出席率稍降 (-10%)</span>
                        </div>
                        <input type="checkbox" id="chkBS" pointer-events="none">
                    </div>

                    <button class="btn-pixel" style="font-size:0.65rem; width:100%; margin-top:4px;" onclick="randomizeEvents()">
                        🎲 隨機突發事件
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script>
        // --- Web Audio Synth ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(freq, duration, type = 'square') {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playPhoneRing() {
            try {
                initAudio();
                // Ringing tone
                playBeep(440, 0.2, 'sine');
                setTimeout(() => playBeep(480, 0.2, 'sine'), 100);
                setTimeout(() => playBeep(440, 0.4, 'sine'), 300);
            } catch(e){}
        }

        function playWinFanfare() {
            const notes = [261, 329, 392, 523, 659, 783, 1046];
            notes.forEach((freq, i) => setTimeout(() => playBeep(freq, 0.12, 'triangle'), i * 70));
        }

        function playFailSound() {
            const notes = [300, 250, 200, 150];
            notes.forEach((freq, i) => setTimeout(() => playBeep(freq, 0.18, 'sawtooth'), i * 90));
        }

        // --- 307 Timetable Data ---
        // Main core subjects (主科) causes probability penalty
        const timetable = {
            Mon: {
                name: '星期一',
                am: [
                    { name: '體育', main: false },
                    { name: '補強-生物', main: true },
                    { name: '選修物理-波動', main: true },
                    { name: '選修物理-波動', main: true }
                ],
                pm: [
                    { name: '數學甲', main: true },
                    { name: '數學甲', main: true },
                    { name: '英語文', main: true },
                    { name: '英文輔', main: true }
                ]
            },
            Tue: {
                name: '星期二',
                am: [
                    { name: '國語文', main: true },
                    { name: '國語文', main: true },
                    { name: '藝術生活', main: false },
                    { name: '全民國防教育', main: false }
                ],
                pm: [
                    { name: '補強-生物', main: true },
                    { name: '數學甲', main: true },
                    { name: '選修化學-反應', main: true },
                    { name: '化學輔', main: true }
                ]
            },
            Wed: {
                name: '星期三',
                am: [
                    { name: '高三彈性學習一', main: false },
                    { name: '國語文', main: true },
                    { name: '英文作文', main: true },
                    { name: '體育', main: false }
                ],
                pm: [
                    { name: '多元選修', main: false },
                    { name: '多元選修', main: false },
                    { name: '音樂', main: false },
                    { name: '數學輔', main: true }
                ]
            },
            Thu: {
                name: '星期四',
                am: [
                    { name: '選修生物-細胞', main: true },
                    { name: '音樂', main: false },
                    { name: '選修化學-反應', main: true },
                    { name: '選修化學-反應', main: true }
                ],
                pm: [
                    { name: '高三彈性學習三', main: false },
                    { name: '英文作文', main: true },
                    { name: '國語文', main: true },
                    { name: '國文輔', main: true }
                ]
            },
            Fri: {
                name: '星期五',
                am: [
                    { name: '數學甲', main: true },
                    { name: '選修生物-細胞', main: true },
                    { name: '團體活動時間', main: false },
                    { name: '團體活動時間', main: false }
                ],
                pm: [
                    { name: '高三彈性學習二', main: false },
                    { name: '英語文', main: true },
                    { name: '選修物理-電磁', main: true },
                    { name: '物理輔', main: true }
                ]
            }
        };

        // --- State Variables ---
        let currentDay = 'Mon';
        let currentMode = 'AM'; // 'AM' or 'PM'
        let eventBA = false;    // Blue Archive Maintenance (-25%)
        let eventBS = false;    // Brawl Stars Maintenance (-10%)
        let phoneBuffActive = false; // Telephone Hotline Call (+15%)
        let isSpinning = false;
        let currentAngle = 0;

        // Auto select current day of week (if weekday)
        const dayIdx = new Date().getDay(); // 0:Sun, 1:Mon ... 5:Fri
        const dayKeys = ['Mon', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Mon'];
        currentDay = dayKeys[dayIdx];

        function selectDay(day) {
            if (isSpinning) return;
            currentDay = day;
            document.querySelectorAll('.btn-day').forEach(b => b.classList.remove('active'));
            document.getElementById('day-' + day).classList.add('active');
            updateUI();
            addLog(`切換至 307 課表：${timetable[day].name}`);
        }

        function toggleEvent(evt) {
            if (isSpinning) return;
            if (evt === 'BA') {
                eventBA = !eventBA;
                document.getElementById('chkBA').checked = eventBA;
                document.getElementById('cardBA').classList.toggle('active', eventBA);
            } else if (evt === 'BS') {
                eventBS = !eventBS;
                document.getElementById('chkBS').checked = eventBS;
                document.getElementById('cardBS').classList.toggle('active', eventBS);
            }
            updateUI();
        }

        function randomizeEvents() {
            if (isSpinning) return;
            eventBA = Math.random() < 0.35;
            eventBS = Math.random() < 0.45;
            document.getElementById('chkBA').checked = eventBA;
            document.getElementById('cardBA').classList.toggle('active', eventBA);
            document.getElementById('chkBS').checked = eventBS;
            document.getElementById('cardBS').classList.toggle('active', eventBS);
            playBeep(523, 0.1);
            updateUI();
            addLog(`🎲 隨機突發事件算牌完成`);
        }

        function callHotline() {
            if (isSpinning) return;
            playPhoneRing();
            
            const status = document.getElementById('phoneStatus');
            status.innerHTML = `<span style="color:var(--accent-gold);">📞 通話中...「Timing很重要，快點來啦！」</span>`;
            
            setTimeout(() => {
                phoneBuffActive = true;
                status.innerHTML = `<span style="color:var(--accent-green);">✅ 熱線成功！出席率 +15% BUFF！</span>`;
                
                const bubble = document.getElementById('speechBubble');
                bubble.innerText = "好啦好啦！Timing對了，馬上出發！";
                bubble.classList.add('show');
                setTimeout(() => bubble.classList.remove('show'), 2500);

                updateUI();
                addLog(`☎️ 打電話催人：觸發「Timing對了」BUFF (+15%)`);
            }, 800);
        }

        function calculateProbability(mode, dayKey) {
            // Base Probabilities
            let prob = mode === 'AM' ? 0.46 : 0.84;

            // 1. Timetable Main Subject Penalty (-5% per main subject)
            const dayData = timetable[dayKey];
            const subjects = mode === 'AM' ? dayData.am : dayData.pm;
            const mainCount = subjects.filter(s => s.main).length;
            const subjectPenalty = mainCount * 0.05;
            prob -= subjectPenalty;

            // 2. Event Modifiers
            if (eventBA) prob -= 0.25; // Blue Archive update
            if (eventBS) prob -= 0.10; // Brawl Stars update

            // 3. Telephone Hotline Buff
            if (phoneBuffActive) prob += 0.15;

            // Clamp between 5% and 95%
            return Math.min(Math.max(prob, 0.05), 0.95);
        }

        function updateUI() {
            const dayData = timetable[currentDay];
            
            // Render Left Panel Schedule Info
            let amHTML = dayData.am.map(s => `<span class="subject-tag ${s.main?'tag-main':'tag-easy'}">${s.name}</span>`).join('');
            let pmHTML = dayData.pm.map(s => `<span class="subject-tag ${s.main?'tag-main':'tag-easy'}">${s.name}</span>`).join('');
            
            const amMainCount = dayData.am.filter(s => s.main).length;
            const pmMainCount = dayData.pm.filter(s => s.main).length;

            document.getElementById('scheduleInfo').innerHTML = `
                <strong style="color:var(--accent-gold);">${dayData.name} 課表概況：</strong><br>
                🌅 上午 (主科:${amMainCount}): ${amHTML}<br>
                🌆 下午 (主科:${pmMainCount}): ${pmHTML}<br>
                <span style="color:#aaa; font-size:0.68rem;">* 每門主科將使該時段出席率 -5%</span>
            `;

            // Calculate current active probability
            const currentProb = calculateProbability(currentMode, currentDay);
            const percentStr = Math.round(currentProb * 100) + '%';
            
            document.getElementById('probDisplay').innerText = `即時算出出席機率：${percentStr}`;
            document.getElementById('currentModeTitle').innerText = `MODE: ${currentMode === 'AM' ? '🌅 上午模式' : '🌆 下午模式'} (${timetable[currentDay].name})`;

            drawWheel(currentProb);
        }

        // --- Canvas Wheel Drawing ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function drawWheel(probYes, rotationAngle = currentAngle) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const angleYes = probYes * 2 * Math.PI;
            const angleNo = (1 - probYes) * 2 * Math.PI;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotationAngle);

            // YES Sector (Green)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, 0, angleYes);
            ctx.closePath();
            ctx.fillStyle = '#00ff88';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // Text YES
            ctx.save();
            ctx.rotate(angleYes / 2);
            ctx.fillStyle = '#000';
            ctx.font = '900 16px "Press Start 2P", "Noto Sans TC"';
            ctx.textAlign = 'right';
            ctx.fillText('會來 ' + Math.round(probYes * 100) + '%', radius - 20, 5);
            ctx.restore();

            // NO Sector (Red)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, angleYes, angleYes + angleNo);
            ctx.closePath();
            ctx.fillStyle = '#ff2a6d';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // Text NO
            ctx.save();
            ctx.rotate(angleYes + angleNo / 2);
            ctx.fillStyle = '#fff';
            ctx.font = '900 16px "Press Start 2P", "Noto Sans TC"';
            ctx.textAlign = 'right';
            ctx.fillText('不來 ' + Math.round((1 - probYes) * 100) + '%', radius - 20, 5);
            ctx.restore();

            // Rim Dots
            for (let i = 0; i < 16; i++) {
                const dotAngle = (i / 16) * Math.PI * 2;
                const dx = Math.cos(dotAngle) * (radius - 5);
                const dy = Math.sin(dotAngle) * (radius - 5);
                ctx.beginPath();
                ctx.arc(dx, dy, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#ffcc00' : '#ffffff';
                ctx.fill();
            }

            ctx.restore();
        }

        function switchAndSpin(mode) {
            if (isSpinning) return;
            currentMode = mode;
            updateUI();
            spinWheel();
        }

        function spinWheel(onComplete = null) {
            if (isSpinning) return;
            isSpinning = true;

            const probYes = calculateProbability(currentMode, currentDay);
            const isYes = Math.random() < probYes;

            const angleYes = probYes * 2 * Math.PI;
            const angleNo = (1 - probYes) * 2 * Math.PI;

            let targetSectorAngle;
            if (isYes) {
                const margin = 0.08;
                targetSectorAngle = margin + Math.random() * (angleYes - 2 * margin);
            } else {
                const margin = 0.08;
                targetSectorAngle = angleYes + margin + Math.random() * (angleNo - 2 * margin);
            }

            const extraRounds = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
            const finalAngle = extraRounds + (1.5 * Math.PI - targetSectorAngle);

            const duration = 3200;
            const startTime = performance.now();
            const startAngle = currentAngle % (2 * Math.PI);
            let lastTick = startAngle;

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);

                currentAngle = startAngle + (finalAngle - startAngle) * easeOut;
                drawWheel(probYes, currentAngle);

                if (Math.abs(currentAngle - lastTick) > 0.3) {
                    playBeep(320 + (1 - progress) * 350, 0.02, 'square');
                    lastTick = currentAngle;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    
                    // Consume phone buff after spin
                    if (phoneBuffActive) {
                        phoneBuffActive = false;
                        document.getElementById('phoneStatus').innerText = "待命 (電話BUFF已使用)";
                    }

                    handleResult(isYes, probYes);
                    if (onComplete) onComplete(isYes);
                }
            }

            requestAnimationFrame(animate);
        }

        function handleResult(isYes, probYes) {
            const resBox = document.getElementById('resultBox');
            const modeText = currentMode === 'AM' ? '上午' : '下午';
            const dayName = timetable[currentDay].name;
            const percentStr = Math.round(probYes * 100) + '%';

            if (isYes) {
                playWinFanfare();
                triggerConfetti();
                resBox.innerHTML = `
                    <div style="color:var(--accent-green); font-size:1.1rem; font-weight:bold;">🎉 【${dayName} ${modeText}】黃玉翔 會來！</div>
                    <div style="font-size:0.8rem; color:#ddd; margin-top:4px;">算出機率 ${percentStr}，擊破萬難成功出席！</div>
                `;
                addLog(`${dayName}${modeText}: <span class="tag-yes">【會來】</span> (極限機率: ${percentStr})`);
            } else {
                playFailSound();
                resBox.innerHTML = `
                    <div style="color:var(--accent-red); font-size:1.1rem; font-weight:bold;">✖ 【${dayName} ${modeText}】黃玉翔 不會來！</div>
                    <div style="font-size:0.8rem; color:#ddd; margin-top:4px;">算出機率 ${percentStr}，沉睡於床鋪不可抗力...</div>
                `;
                addLog(`${dayName}${modeText}: <span class="tag-no">【不來】</span> (機率: ${percentStr})`);
            }
            updateUI();
        }

        function spinFullDay() {
            if (isSpinning) return;
            const resBox = document.getElementById('resultBox');
            resBox.innerHTML = `<div style="color:var(--accent-gold); font-size:1rem; font-weight:bold;">⚡ 進行 ${timetable[currentDay].name} 全日雙考驗...</div>`;

            currentMode = 'AM';
            updateUI();
            
            spinWheel((amYes) => {
                setTimeout(() => {
                    currentMode = 'PM';
                    updateUI();
                    spinWheel((pmYes) => {
                        let comment = "";
                        if (amYes && pmYes) comment = "👑 完美全勤！主科與誘惑全擋下了！";
                        else if (!amYes && pmYes) comment = "⏰ 上午主科缺席，下午精準歸隊！";
                        else if (amYes && !pmYes) comment = "🏃 上午看完快閃，下午提早消失！";
                        else comment = "💤 遊戲+課表重創！整天人間蒸發！";

                        resBox.innerHTML = `
                            <div style="color:var(--accent-gold); font-size:1rem; font-weight:bold;">⚡ ${timetable[currentDay].name} 雙考驗結果：</div>
                            <div style="font-size:0.85rem; color:#fff; margin-top:4px;">
                                上午: ${amYes ? '<span class="tag-yes">會來</span>' : '<span class="tag-no">不來</span>'} | 
                                下午: ${pmYes ? '<span class="tag-yes">會來</span>' : '<span class="tag-no">不來</span>'}<br>
                                <strong>評語：${comment}</strong>
                            </div>
                        `;
                    });
                }, 1000);
            });
        }

        function speakRandomQuote() {
            playBeep(440, 0.08);
            const quotes = [
                "Timing真的很重要好嗎！",
                "這堂有物理/化學/數甲？那我考慮一下...",
                "蔚藍檔案更新？那我必須先清理體力！",
                "荒野亂鬥開新賽季了啦！",
                "武陵307號出席大考驗！",
                "電話響了？我這就出門！"
            ];
            const bubble = document.getElementById('speechBubble');
            bubble.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            bubble.classList.add('show');
            setTimeout(() => bubble.classList.remove('show'), 2200);
        }

        function addLog(msg) {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            box.innerHTML = `<div>[${time}] ${msg}</div>` + box.innerHTML;
        }

        function triggerConfetti() {
            const confCanvas = document.getElementById('confettiCanvas');
            const cctx = confCanvas.getContext('2d');
            confCanvas.width = window.innerWidth;
            confCanvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#00ff88', '#ff2a6d', '#ffcc00', '#05d9e8', '#ffffff'];

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.8) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1
                });
            }

            function render() {
                cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
                let alive = false;
                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.4;
                        p.life -= 0.02;
                        cctx.fillStyle = p.color;
                        cctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                });
                if (alive) requestAnimationFrame(render);
            }
            render();
        }

        // Init
        document.getElementById('day-' + currentDay).classList.add('active');
        updateUI();
    </script>
</body>
</html>
